# GitHub account whose pull requests are collected each week, and a token with at least
# "repo" read scope (classic PAT) or "Pull requests: read" (fine-grained PAT).
github.username=${GITHUB_USERNAME:mathecruz}
github.token=${GITHUB_TOKEN}

quarkus.rest-client.github-api.url=https://api.github.com

quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=${OPENAI_MODEL:gpt-4o-mini}
quarkus.langchain4j.openai.timeout=60s

# Command-mode app: run once, print the result, exit. Logging goes to stderr so stdout carries
# only the final markdown report (the CI workflow relies on this to build a clean job summary).
quarkus.banner.enabled=false
quarkus.log.console.stderr=true
