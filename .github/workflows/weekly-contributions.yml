name: Weekly contributions report

on:
  schedule:
    # Every Friday at 20:00 UTC — covers Monday..Friday of the current week.
    - cron: "0 20 * * 5"
  workflow_dispatch:
    inputs:
      since:
        description: "Override start date (YYYY-MM-DD). Leave empty to use the current work week."
        required: false
      until:
        description: "Override end date (YYYY-MM-DD). Leave empty to use the current work week."
        required: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: ./mvnw -B -DskipTests package

      - name: Generate weekly contributions report and open issue
        env:
          GITHUB_USERNAME: ${{ env.CONTRIBUTIONS_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTIONS_GH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          java -jar target/quarkus-app/quarkus-run.jar \
            ${{ inputs.since && format('--since={0}', inputs.since) || '' }} \
            ${{ inputs.until && format('--until={0}', inputs.until) || '' }}
